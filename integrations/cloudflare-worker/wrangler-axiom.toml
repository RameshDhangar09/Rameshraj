# Axiom AI chat – Cloudflare Worker configuration (see axiom-chat.js)
name = "hyt-axiom-chat"
main = "axiom-chat.js"
compatibility_date = "2026-10-01"

[vars]
SITE_ORIGIN = "https://hytengineering.com"     # where /axiom/<lang>.json is published
ALLOWED_ORIGIN = "https://hytengineering.com"  # only the website may call this function
PER_IP_LIMIT = "30"                            # questions per visitor IP per hour
DAILY_LIMIT = "2000"                           # questions per day for the whole site (cost cap)

# Rate limiting and daily cap
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (never commit): wrangler secret put ANTHROPIC_API_KEY --config wrangler-axiom.toml
