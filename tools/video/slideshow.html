<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
.s{position:absolute;inset:0;opacity:0;animation:show 14s linear infinite}
.s img{width:100%;height:100%;object-fit:cover;animation:kb 14s linear infinite}
.s:nth-child(1){animation-delay:0s}.s:nth-child(2){animation-delay:2.8s}.s:nth-child(3){animation-delay:5.6s}.s:nth-child(4){animation-delay:8.4s}.s:nth-child(5){animation-delay:11.2s}
.s:nth-child(n) img{animation-delay:inherit}
@keyframes show{0%{opacity:0}3%{opacity:1}20%{opacity:1}23%{opacity:0}100%{opacity:0}}
@keyframes kb{0%{transform:scale(1.02) translate(0,0)}23%{transform:scale(1.12) translate(-2%,-1%)}100%{transform:scale(1.12) translate(-2%,-1%)}}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,22,25,.75),transparent 40%)}
.cap{position:absolute;left:56px;bottom:52px;color:#fff}
.cap b{display:block;font-size:34px;letter-spacing:.5px}.cap span{display:block;margin-top:8px;color:#F58220;font-size:16px;letter-spacing:3px;font-weight:700}
.bar{position:absolute;left:56px;bottom:40px;width:180px;height:3px;background:#F58220}
.tag{position:absolute;right:28px;top:24px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.85);font-size:14px;letter-spacing:2px;padding:6px 12px;border-radius:20px;font-weight:700}
</style></head><body>
